# 워크플로우(작업) 이름
name: GitOps DOCKER CICD Pipeline
# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches: ["main"]  # <- 하나만 있을때
      # - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest  # 실제 작업 주체

    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}


    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    # ECR에 Docker 이미지 빌드 및 푸시
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
            
    - name: S3 정적웹사이트로 docker-compose.yaml 배포
      run: |
        # 전체 동기화 / 하나만 동기화하고 싶으면 cp
        aws s3 cp ./docker-compose.yaml s3://std19-website0914-bucket/docker-compose.yaml

    - name: Build and push Docker image to ECR
      # env:
      #   ECR_REGISTRY: ${{}}
      #   ECR_REPOSITORY: ${{}}
      #   IMAGE_TAG: ${{github.sha}}
      run: |
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:1.31.3-ecr ./nginx
        docker build --no-cache -t 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:latest ./nginx

        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:1.31.3-ecr
        docker push 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:latest
      
    - name: 컨테이너 배포 및 S3 파일 싱크
      run: |
        # 소스 데이터 S3 버킷으로 업로드
        aws ssm send-command \
          --instance-ids "i-07b5248d6b8c9faf1" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.us-west-2.amazonaws.com\",
            \"sudo docker stop nginx-container || true\",
            \"sudo docker rm nginx-container || true\",
            \"sudo aws s3 cp s3://std19-website0914-bucket/docker-compose.yaml ./docker-compose.yaml\",
            \"docker compose pull\",
            \"docker compose up -d --remove-orphans\",
            \"docker image prune -f\"
          ]" \
          --region ${{secrets.AWS_REGION}} \
          --comment "Deploying SSM docker"
