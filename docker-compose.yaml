services:
  my-service-web:
    image: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - /home/ec2-user/nginx/html:/usr/share/nginx/html:ro
      # - /home/ec2-user/nginx/logs:/var/log/nginx
    restart: always
    networks:
      - public-subnet
    #     aliases:
    #       - nginx

  my-app:
    image: 925047940866.dkr.ecr.us-west-2.amazonaws.com/std19-fastapi:latest
    container_name: fastapi-container
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - public-subnet

networks:
  public-subnet:
    driver: bridge
